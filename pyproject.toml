[project]
name = "anomaly-detection-feature-extraction"
version = "0.1.0"
description = "Mock kafka -> windowed aggregation -> elasticsearch pipeline"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.3",
    "elasticsearch>=8.10,<9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "flake8>=7.0",
    "flake8-pyproject>=1.2",
    "isort>=5.13",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agg_pipeline", "mock_producer"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
extend-exclude = [".venv"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true
